<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<nav class="navbar">

    <a class="logo" href="index.html">
        <img src="assets/resume-spark.svg" alt="">
        <span>AI Resume Scanner</span>
    </a>

    <a href="login.html">
        Login
    </a>

</nav>


<div class="form-container">

    <div class="form-card">

        <h1>Create Account</h1>

        <form id="registerForm">

            <label>Name</label>

            <input
                type="text"
                id="registerName"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="registerEmail"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <p id="registerMessage"></p>


        <p>
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</div>


<script type="module" src="script.js"></script>

</body>

</html>
